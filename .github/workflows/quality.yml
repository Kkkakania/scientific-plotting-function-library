name: quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Publication readiness
        run: python scripts/check_publication_ready.py
      - name: Release state consistency
        run: python scripts/check_release_state.py
      - name: Generated files are current
        run: |
          python scripts/build_manifest.py
          python scripts/build_gallery_index.py
          python scripts/build_palette_picker.py
          python scripts/sync_matlab_palettes.py
          git diff --exit-code \
            manifest.json \
            catalog.md \
            gallery/index.html \
            palettes/palette_picker.html \
            palettes/matlab/sci_palettes.m \
            palettes/matlab/sci_palettes_list.m
      - name: Tests
        run: python -m pytest tests/
